<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Speaking Practice — 英語スピーキング練習アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fdf8f0;--card:#fffefb;--card2:#f7f2e8;
  --teal:#1b5080;--teal-l:rgba(27,80,128,0.10);--teal-m:#3d6b96;
  --orange:#e8651a;--orange-l:rgba(232,101,26,0.12);
  --purple:#6d28d9;--purple-l:rgba(109,40,217,0.10);
  --border:#e2d9cc;--t1:#1a2a3a;--t2:#5a6a7a;--t3:#8a9aaa;
}
body{
  font-family:'Nunito',sans-serif;background:var(--bg);color:var(--t1);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:48px 16px 32px;
}
.logo{font-size:36px;line-height:1;margin-bottom:10px;}
.logo-text{font-family:'Lora',serif;font-size:24px;font-weight:700;color:var(--teal);text-align:center;}
.sub{color:var(--t2);font-size:13.5px;margin-top:8px;text-align:center;max-width:440px;line-height:1.7;}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:720px;width:100%;margin-top:34px;}
@media (max-width:620px){.cards{grid-template-columns:1fr;}}
.card{
  background:var(--card);border:1.5px solid var(--border);border-radius:16px;
  padding:26px 22px;text-decoration:none;color:var(--t1);
  display:flex;flex-direction:column;gap:10px;transition:all .18s;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.card:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(27,80,128,.12);transform:translateY(-2px);}
.card-icon{font-size:32px;}
.card-title{font-size:17px;font-weight:800;}
.card-desc{font-size:12.5px;color:var(--t2);line-height:1.7;}
.card-tag{align-self:flex-start;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:12px;margin-top:2px;}
.tag-own{background:var(--teal-l);color:var(--teal);}
.tag-gpt{background:var(--purple-l);color:var(--purple);}
footer{margin-top:40px;font-size:11px;color:var(--t3);text-align:center;}
</style>
</head>
<body>
  <div class="logo">🗣️</div>
  <div class="logo-text">English Speaking Practice</div>
  <p class="sub">英語スピーキングを練習する方法を2つから選べます。どちらも音声でのレッスン・振り返りができます。</p>
  <div class="cards">
    <a class="card" href="app.html">
      <div class="card-icon">📝</div>
      <div class="card-title">自作アプリで練習</div>
      <div class="card-desc">このサイト専用の練習アプリです。音声での英会話練習、発音/ニュアンス判定(AIモード)、復習タブがあります。</div>
      <span class="card-tag tag-own">このサイト内で完結</span>
    </a>
    <a class="card" href="chatgpt.html">
      <div class="card-icon">💬</div>
      <div class="card-title">ChatGPTで英会話レッスン</div>
      <div class="card-desc">ChatGPTを「オンライン英会話講師」として使うための設定・使い方の説明です。実際のレッスンはChatGPTの画面上で行います。</div>
      <span class="card-tag tag-gpt">ChatGPT側で実施</span>
    </a>
  </div>
  <footer>English Speaking App</footer>
</body>
</html>
